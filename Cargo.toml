[workspace]
members = [
    "crates/common",
    "crates/agent",
    "crates/client",
    "crates/window",
]
resolver = "2"

[workspace.package]
license = "MIT"

[workspace.dependencies]
anyhow = "=1.0.104"
aws-lc-sys = "=0.47.0"
bytes = "=1.12.1"
clap = { version = "=4.6.7", features = ["derive"] }
dirs = "=5.0.1"
enigo = "=0.1.3"
hmac = "=0.12.1"
prost = "=0.12.6"
prost-build = "=0.12.6"
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rand = "=0.8.8"
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs"] }
screenshots = "=0.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
socket2 = "=0.6.5"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "io-std", "net", "process"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "ansi"] }
windows = "=0.62.2"
zeroize = "=1.9.1"
