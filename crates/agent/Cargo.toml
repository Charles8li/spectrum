[package]
name = "lanrdp-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
lanrdp-common = { path = "../common" }
portable-pty = "0.8"
quinn = "0.10"
rcgen = "0.11"
rustls = { version = "0.21", default-features = false, features = ["std", "dangerous_configuration"] }
rustls-pemfile = "1"
screenshots = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
bytesize = "1"
zstd = "0.13"
enigo = "0.1"
async-stream = "0.3"
