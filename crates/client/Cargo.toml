[package]
name = "lanrdp-client"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
lanrdp-common = { path = "../common" }
quinn = "0.10"
rustls = { version = "0.21", default-features = false, features = ["std", "dangerous_configuration"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
async-stream = "0.3"
termion = "2"
indicatif = "0.17"
hostname = "0.3"
